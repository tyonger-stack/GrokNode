name: repository checks

on:
  push:
  pull_request:
  # Lets the network-dependent suite be run on demand — see the `network` job.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # research-archives/original/**/*.dmg is Git LFS tracked; without
          # this the checkout leaves a 134-byte pointer and the pinned
          # release-inventory test fails with `134 !== 155793020`.
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Prepare Node Agent TokenHub protocol test dependencies
        run: npm install --global --prefix "$HOME/.npm-global" --ignore-scripts --no-audit --no-fund @bitkyc08/opencodex@2.78.0
      - name: Run source and publication checks
        # Same gate as `npm run check`, except the suite list. The real-network
        # web tools tests are excluded here: they turned this required job red
        # three times on runner-network wobble alone, with no change to the code
        # under test. Nothing is lost — `npm test` still runs them, and the
        # `network` job below runs them on demand.
        run: |
          npm run typecheck
          npm run source:typecheck
          npm run test:offline
      - name: Build the editable frontend
        run: npm run frontend:build
      - name: Verify a fresh clean-history export is lossless
        run: npm run publication:check
  # The URL-scheme and app-identity gates spawn macOS plutil, so the ubuntu
  # job skips them; this job runs the identity test file (including the
  # darwin-only scheme-gate branches) on a real macOS runner. It also runs the
  # feishu bridge tests, whose ingress half decrypts through CommonCrypto and is
  # therefore skipped by that test file's own platform guard on the ubuntu job.
  check-darwin:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Run the identity, scheme-gate and macOS bridge tests
        run: node --test tests/grok-node-identity.test.mjs tests/local-feishu-bridge.test.mjs
  # The real-network web tools tests, kept out of the required gate and run only
  # when a human asks for them. Nothing here is platform specific; it is purely
  # dependent on the runner being able to reach the public internet.
  network:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Run the real-network web tools tests
        run: node --test tests/local-web-tools-network.test.mjs
