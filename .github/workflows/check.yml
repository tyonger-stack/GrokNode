name: repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # research-archives/original/**/*.dmg is Git LFS tracked; without
          # this the checkout leaves a 134-byte pointer and the pinned
          # release-inventory test fails with `134 !== 155793020`.
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Run source and publication checks
        run: npm run check
      - name: Build the editable frontend
        run: npm run frontend:build
      - name: Verify a fresh clean-history export is lossless
        run: npm run publication:check
  # The URL-scheme and app-identity gates spawn macOS plutil, so the ubuntu
  # job skips them; this job runs the identity test file (including the
  # darwin-only scheme-gate branches) on a real macOS runner.
  check-darwin:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Run the identity and scheme-gate tests
        run: node --test tests/grok-node-identity.test.mjs
